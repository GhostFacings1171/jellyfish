<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deep</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #030711;
    cursor: default;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<canvas id="ocean"></canvas>
<script>
const canvas = document.getElementById('ocean');
const ctx = canvas.getContext('2d', { alpha: false });
let W, H, DPR;

function resize() {
  // Cap DPR at 1 for performance headroom on full-screen animated canvas.
  DPR = 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function rand(a, b) { return a + Math.random() * (b - a); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

// ---------- Bell-type jellyfish ----------
// Gradients are built once (in local/object space) and reused every frame
// instead of being recreated per-draw-call. Glow is done via a soft radial
// halo instead of expensive shadowBlur.
class BellJelly {
  constructor(depth) {
    this.depth = depth;
    this.reset(true);
    this.buildStyles();
  }

  reset(initial) {
    const d = this.depth;
    this.size = rand(30, 78) * (0.55 + d * 0.9);
    this.x = rand(-0.1, 1.1) * W;
    this.y = initial ? rand(-0.1, 1.1) * H : H + this.size * 2.2;
    this.driftX = rand(-0.09, 0.09);
    this.riseSpeed = rand(0.10, 0.28) * (0.5 + d * 0.9);
    this.phase = rand(0, Math.PI * 2);
    this.pulseSpeed = rand(0.55, 0.9);
    this.tentacleCount = Math.floor(rand(6, 9));
    this.tentacleLen = this.size * rand(2.4, 3.8);
    this.hue = pick([198, 205, 190, 210]);
    this.coreAlpha = rand(0.55, 0.95) * (0.3 + d * 0.8);
    this.wobblePhase = rand(0, Math.PI * 2);
    this.tSeed = rand(0, 100);
    this.farBlurAlpha = (1 - d) * 0.18; // faux soft-focus via extra low-alpha wash instead of ctx.filter
    this.tilt = rand(-0.12, 0.12);
  }

  buildStyles() {
    const s = this.size;
    const hue = this.hue;
    const a = this.coreAlpha;

    // Halo gradient (object space, centered near bell)
    const haloR = s * 2.6;
    this.haloGrad = ctx.createRadialGradient(0, -s * 0.15, 0, 0, -s * 0.15, haloR);
    this.haloGrad.addColorStop(0, `hsla(${hue}, 100%, 70%, ${a * 0.26})`);
    this.haloGrad.addColorStop(1, `hsla(${hue}, 100%, 50%, 0)`);
    this.haloR = haloR;

    // Tentacle stroke gradient (shared across all tentacles of this jelly)
    this.tentGrad = ctx.createLinearGradient(0, 0, 0, this.tentacleLen);
    this.tentGrad.addColorStop(0, `hsla(${hue}, 100%, 75%, ${a * 0.85})`);
    this.tentGrad.addColorStop(1, `hsla(${hue}, 100%, 55%, 0)`);

    // Oral arm stroke style
    this.oralStyle = `hsla(${hue}, 100%, 80%, ${a * 0.6})`;

    // Bell fill gradient
    const bh = s * 0.62;
    this.bellGrad = ctx.createLinearGradient(0, -bh * 1.7, 0, s * 0.1);
    this.bellGrad.addColorStop(0, `hsla(${hue}, 100%, 88%, ${a})`);
    this.bellGrad.addColorStop(0.55, `hsla(${hue}, 100%, 70%, ${a * 0.75})`);
    this.bellGrad.addColorStop(1, `hsla(${hue}, 100%, 50%, ${a * 0.15})`);

    this.ribStyle = `hsla(${hue}, 100%, 92%, ${a * 0.5})`;
  }

  update(t, dt) {
    this.y -= this.riseSpeed * dt * 18;
    this.x += (this.driftX + Math.sin(t * 0.15 + this.wobblePhase) * 0.06) * dt * 18;
    if (this.y < -this.tentacleLen * 1.3 || this.x < -this.size * 3 || this.x > W + this.size * 3) {
      this.reset(false);
      this.buildStyles();
    }
  }

  draw(t) {
    const s = this.size;
    const pulse = Math.sin(t * this.pulseSpeed + this.phase);
    const bellSquash = 1 + pulse * 0.14;
    const bellHeight = 1 - pulse * 0.10;

    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.tilt);

    // halo (glow substitute - cheap, single fill, no shadowBlur)
    ctx.fillStyle = this.haloGrad;
    ctx.beginPath();
    ctx.ellipse(0, -s * 0.15, this.haloR * bellSquash, this.haloR * 0.75, 0, 0, Math.PI * 2);
    ctx.fill();

    // tentacles
    ctx.lineCap = 'round';
    ctx.strokeStyle = this.tentGrad;
    ctx.lineWidth = Math.max(0.6, s * 0.02);
    const segs = 9;
    for (let i = 0; i < this.tentacleCount; i++) {
      const spread = (i / (this.tentacleCount - 1) - 0.5) * s * 1.7 * bellSquash;
      const len = this.tentacleLen * (0.75 + 0.5 * Math.abs(Math.sin(i * 12.9898 + this.tSeed)));
      const sway = 0.35 + 0.25 * Math.sin(i * 3.1 + this.tSeed);
      ctx.beginPath();
      ctx.moveTo(spread * 0.6, s * 0.05);
      for (let j = 1; j <= segs; j++) {
        const f = j / segs;
        const waveA = Math.sin(t * 1.2 + i * 1.7 + f * 5 + this.tSeed) * (s * sway * 0.22) * f;
        const waveB = Math.sin(t * 0.6 + i * 0.9 - f * 3 + this.tSeed * 0.5) * (s * 0.12) * f;
        const nx = spread * (0.6 + f * 0.5) + waveA + waveB;
        const ny = s * 0.05 + f * len;
        ctx.lineTo(nx, ny);
      }
      ctx.stroke();
    }

    // oral arms
    ctx.strokeStyle = this.oralStyle;
    ctx.lineWidth = s * 0.03;
    for (let i = 0; i < 4; i++) {
      const ox = (i - 1.5) * s * 0.16;
      const len2 = s * 1.3;
      ctx.beginPath();
      ctx.moveTo(ox, s * 0.05);
      for (let j = 1; j <= 6; j++) {
        const f = j / 6;
        const w = Math.sin(t * 1.6 + i * 2 + f * 6 + this.tSeed) * s * 0.1 * f;
        ctx.lineTo(ox + w, s * 0.05 + f * len2);
      }
      ctx.stroke();
    }

    // bell dome
    ctx.beginPath();
    const bw = s * bellSquash;
    const bh = s * 0.62 * bellHeight;
    ctx.moveTo(-bw, 0);
    ctx.bezierCurveTo(-bw, -bh * 1.7, bw, -bh * 1.7, bw, 0);
    const scallops = 7;
    for (let i = 0; i <= scallops; i++) {
      const f = i / scallops;
      const x = bw - f * bw * 2;
      const scallopY = Math.sin(f * Math.PI * scallops) * s * 0.05;
      ctx.lineTo(x, scallopY * 0.5 + s * 0.02);
    }
    ctx.closePath();
    ctx.fillStyle = this.bellGrad;
    ctx.fill();

    // rib lines
    ctx.strokeStyle = this.ribStyle;
    ctx.lineWidth = Math.max(0.5, s * 0.012);
    for (let i = -3; i <= 3; i++) {
      const rx = (i / 3.5) * bw;
      ctx.beginPath();
      ctx.moveTo(rx, -bh * 1.55);
      ctx.quadraticCurveTo(rx * 0.8, -bh * 0.6, rx * 0.55, s * 0.02);
      ctx.stroke();
    }

    // faux soft-focus wash for "far" jellies (cheap alternative to ctx.filter blur)
    if (this.farBlurAlpha > 0.01) {
      ctx.fillStyle = `rgba(4, 12, 25, ${this.farBlurAlpha})`;
      ctx.beginPath();
      ctx.ellipse(0, -s * 0.3, s * 1.6, s * 1.4, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }
}

// ---------- Flower-type jellyfish ----------
class FlowerJelly {
  constructor() {
    this.reset(true);
    this.buildStyles();
  }

  reset(initial) {
    this.size = rand(26, 46);
    this.x = rand(-0.1, 1.1) * W;
    this.y = initial ? rand(-0.1, 1.1) * H : H + this.size * 2;
    this.riseSpeed = rand(0.06, 0.14);
    this.driftX = rand(-0.05, 0.05);
    this.phase = rand(0, Math.PI * 2);
    this.hue = pick([195, 200, 205]);
    this.rays = Math.floor(rand(14, 18));
    this.alpha = rand(0.5, 0.85);
    this.tSeed = rand(0, 100);
  }

  buildStyles() {
    const s = this.size, hue = this.hue, a = this.alpha;
    const haloR = s * 2.8;
    this.haloGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, haloR);
    this.haloGrad.addColorStop(0, `hsla(${hue}, 100%, 70%, ${a * 0.22})`);
    this.haloGrad.addColorStop(1, `hsla(${hue}, 100%, 50%, 0)`);
    this.haloR = haloR;

    this.rayStyle = `hsla(${hue}, 100%, 78%, ${a * 0.8})`;

    const coreR = s * 0.42;
    this.coreGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, coreR);
    this.coreGrad.addColorStop(0, `hsla(${hue}, 100%, 95%, ${a})`);
    this.coreGrad.addColorStop(1, `hsla(${hue}, 100%, 70%, ${a * 0.2})`);
  }

  update(t, dt) {
    this.y -= this.riseSpeed * dt * 18;
    this.x += this.driftX * dt * 18;
    if (this.y < -this.size * 3 || this.x < -this.size * 3 || this.x > W + this.size * 3) {
      this.reset(false);
      this.buildStyles();
    }
  }

  draw(t) {
    const s = this.size;
    const pulse = 1 + Math.sin(t * 0.7 + this.phase) * 0.08;
    ctx.save();
    ctx.translate(this.x, this.y);

    ctx.fillStyle = this.haloGrad;
    ctx.beginPath();
    ctx.arc(0, 0, this.haloR, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = this.rayStyle;
    ctx.lineWidth = s * 0.045;
    ctx.lineCap = 'round';
    for (let i = 0; i < this.rays; i++) {
      const a2 = (i / this.rays) * Math.PI * 2;
      const wig = Math.sin(t * 1.4 + i * 1.3 + this.tSeed) * 0.12;
      const len = s * pulse * (0.9 + 0.3 * Math.sin(i * 7.1 + this.tSeed));
      const x1 = Math.cos(a2) * s * 0.5;
      const y1 = Math.sin(a2) * s * 0.5;
      const x2 = Math.cos(a2 + wig) * len;
      const y2 = Math.sin(a2 + wig) * len;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.quadraticCurveTo(Math.cos(a2) * len * 0.6, Math.sin(a2) * len * 0.6, x2, y2);
      ctx.stroke();
    }

    const coreR = s * 0.42 * pulse;
    ctx.fillStyle = this.coreGrad;
    ctx.beginPath();
    ctx.arc(0, 0, coreR, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

// ---------- Marine snow particles (drawn in a single batched pass) ----------
class Particle {
  constructor() { this.reset(true); }
  reset(initial) {
    this.x = rand(0, W);
    this.y = initial ? rand(0, H) : H + rand(0, 20);
    this.r = rand(0.4, 1.4);
    this.speed = rand(0.01, 0.05);
    this.alpha = rand(0.08, 0.3);
    this.drift = rand(-0.02, 0.02);
    this.phase = rand(0, Math.PI * 2);
  }
  update(dt, t) {
    this.y -= this.speed * dt * 18;
    this.x += (this.drift + Math.sin(t * 0.2 + this.phase) * 0.03) * dt * 18;
    if (this.y < -5) this.reset(false);
  }
}

// ---------- Scene setup ----------
const bellJellies = [];
const flowerJellies = [];
const particles = [];
let bgGradient = null;

function buildScene() {
  resize();
  bellJellies.length = 0;
  flowerJellies.length = 0;
  particles.length = 0;

  // Conservative counts, capped, so large/full-screen displays stay smooth.
  const area = W * H;
  const jellyCount = Math.min(11, Math.max(5, Math.round(area / 260000)));
  for (let i = 0; i < jellyCount; i++) {
    bellJellies.push(new BellJelly(rand(0, 1)));
  }
  const flowerCount = Math.min(4, Math.max(2, Math.round(jellyCount / 3)));
  for (let i = 0; i < flowerCount; i++) {
    flowerJellies.push(new FlowerJelly());
  }
  const particleCount = Math.min(70, Math.max(24, Math.round(area / 16000)));
  for (let i = 0; i < particleCount; i++) {
    particles.push(new Particle());
  }

  bgGradient = ctx.createRadialGradient(
    W * 0.5, H * 0.65, 0,
    W * 0.5, H * 0.65, Math.max(W, H) * 0.85
  );
  bgGradient.addColorStop(0, '#071427');
  bgGradient.addColorStop(0.45, '#04101f');
  bgGradient.addColorStop(1, '#020509');
}

let resizeTimeout;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimeout);
  resizeTimeout = setTimeout(buildScene, 150);
});

buildScene();

let last = performance.now();
let elapsed = 0;

function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if (!prefersReducedMotion) elapsed += dt;

  ctx.fillStyle = bgGradient;
  ctx.fillRect(0, 0, W, H);

  // particles: single fill style batch, no per-particle state churn
  ctx.fillStyle = 'rgba(150, 190, 230, 1)';
  for (const p of particles) {
    if (!prefersReducedMotion) p.update(dt, elapsed);
    ctx.globalAlpha = p.alpha;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const j of bellJellies) {
    if (!prefersReducedMotion) j.update(elapsed, dt);
    j.draw(elapsed);
  }

  for (const f of flowerJellies) {
    if (!prefersReducedMotion) f.update(elapsed, dt);
    f.draw(elapsed);
  }

  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
</body>
</html>
