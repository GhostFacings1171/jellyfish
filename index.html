<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deep</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #030711;
    cursor: default;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<canvas id="ocean"></canvas>
<script>
const canvas = document.getElementById('ocean');
const ctx = canvas.getContext('2d');
let W, H, DPR;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function rand(a, b) { return a + Math.random() * (b - a); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

// ---------- Bell-type jellyfish (classic dome + trailing tentacles) ----------
class BellJelly {
  constructor(depth) {
    this.depth = depth; // 0 = far/background, 1 = near/foreground
    this.reset(true);
  }

  reset(initial) {
    const d = this.depth;
    this.size = rand(30, 78) * (0.55 + d * 0.9);
    this.x = rand(-0.1, 1.1) * W;
    this.y = initial ? rand(-0.1, 1.1) * H : H + this.size * 2.2;
    this.driftX = rand(-0.09, 0.09);
    this.riseSpeed = rand(0.10, 0.28) * (0.5 + d * 0.9);
    this.phase = rand(0, Math.PI * 2);
    this.pulseSpeed = rand(0.55, 0.9);
    this.tentacleCount = Math.floor(rand(7, 12));
    this.tentacleLen = this.size * rand(2.6, 4.4);
    this.hue = pick([198, 205, 190, 210]);
    this.coreAlpha = rand(0.55, 0.95) * (0.35 + d * 0.75);
    this.wobblePhase = rand(0, Math.PI * 2);
    this.tSeed = rand(0, 100);
    this.blur = (1 - d) * 3.2;
    this.tilt = rand(-0.12, 0.12);
  }

  update(t, dt) {
    this.y -= this.riseSpeed * dt * 18;
    this.x += (this.driftX + Math.sin(t * 0.15 + this.wobblePhase) * 0.06) * dt * 18;
    if (this.y < -this.tentacleLen * 1.3 || this.x < -this.size * 3 || this.x > W + this.size * 3) {
      this.reset(false);
    }
  }

  draw(t) {
    const s = this.size;
    const pulse = Math.sin(t * this.pulseSpeed + this.phase);
    const bellSquash = 1 + pulse * 0.14; // widen
    const bellHeight = 1 - pulse * 0.10; // flatten as it widens

    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.tilt);
    ctx.filter = this.blur > 0.1 ? `blur(${this.blur.toFixed(2)}px)` : 'none';

    const core = `hsla(${this.hue}, 100%, 78%, ${this.coreAlpha})`;
    const mid = `hsla(${this.hue}, 100%, 60%, ${this.coreAlpha * 0.5})`;
    const edge = `hsla(${this.hue}, 100%, 40%, 0)`;

    // outer glow halo
    const haloR = s * 2.6 * bellSquash;
    const halo = ctx.createRadialGradient(0, -s * 0.15, 0, 0, -s * 0.15, haloR);
    halo.addColorStop(0, `hsla(${this.hue}, 100%, 70%, ${this.coreAlpha * 0.28})`);
    halo.addColorStop(1, edge);
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.ellipse(0, -s * 0.15, haloR, haloR * 0.75, 0, 0, Math.PI * 2);
    ctx.fill();

    // tentacles (drawn first, beneath bell)
    ctx.lineCap = 'round';
    for (let i = 0; i < this.tentacleCount; i++) {
      const spread = (i / (this.tentacleCount - 1) - 0.5) * s * 1.7 * bellSquash;
      const len = this.tentacleLen * (0.75 + 0.5 * Math.abs(Math.sin(i * 12.9898 + this.tSeed)));
      const segs = 14;
      const sway = 0.35 + 0.25 * Math.sin(i * 3.1 + this.tSeed);
      ctx.beginPath();
      let px = spread * 0.6, py = s * 0.05;
      ctx.moveTo(px, py);
      for (let j = 1; j <= segs; j++) {
        const f = j / segs;
        const waveA = Math.sin(t * 1.2 + i * 1.7 + f * 5 + this.tSeed) * (s * sway * 0.22) * f;
        const waveB = Math.sin(t * 0.6 + i * 0.9 - f * 3 + this.tSeed * 0.5) * (s * 0.12) * f;
        const nx = spread * (0.6 + f * 0.5) + waveA + waveB;
        const ny = py + f * len;
        ctx.lineTo(nx, ny);
      }
      const grad = ctx.createLinearGradient(0, 0, 0, len);
      grad.addColorStop(0, `hsla(${this.hue}, 100%, 75%, ${this.coreAlpha * 0.85})`);
      grad.addColorStop(1, `hsla(${this.hue}, 100%, 55%, 0)`);
      ctx.strokeStyle = grad;
      ctx.lineWidth = Math.max(0.6, s * 0.018);
      ctx.shadowColor = `hsla(${this.hue}, 100%, 65%, 0.9)`;
      ctx.shadowBlur = s * 0.25;
      ctx.stroke();
    }
    ctx.shadowBlur = 0;

    // oral arms (short frilly ones under bell center)
    for (let i = 0; i < 5; i++) {
      const ox = (i - 2) * s * 0.16;
      const len2 = s * 1.3;
      ctx.beginPath();
      ctx.moveTo(ox, s * 0.05);
      for (let j = 1; j <= 8; j++) {
        const f = j / 8;
        const w = Math.sin(t * 1.6 + i * 2 + f * 6 + this.tSeed) * s * 0.1 * f;
        ctx.lineTo(ox + w, s * 0.05 + f * len2);
      }
      ctx.strokeStyle = `hsla(${this.hue}, 100%, 80%, ${this.coreAlpha * 0.6})`;
      ctx.lineWidth = s * 0.03;
      ctx.stroke();
    }

    // bell dome
    ctx.beginPath();
    const bw = s * bellSquash;
    const bh = s * 0.62 * bellHeight;
    ctx.moveTo(-bw, 0);
    ctx.bezierCurveTo(-bw, -bh * 1.7, bw, -bh * 1.7, bw, 0);
    // scalloped bottom edge
    const scallops = 8;
    for (let i = 0; i <= scallops; i++) {
      const f = i / scallops;
      const x = bw - f * bw * 2;
      const scallopY = Math.sin(f * Math.PI * scallops) * s * 0.05;
      ctx.lineTo(x, scallopY * 0.5 + s * 0.02);
    }
    ctx.closePath();

    const bellGrad = ctx.createLinearGradient(0, -bh * 1.7, 0, s * 0.1);
    bellGrad.addColorStop(0, `hsla(${this.hue}, 100%, 88%, ${this.coreAlpha})`);
    bellGrad.addColorStop(0.55, `hsla(${this.hue}, 100%, 70%, ${this.coreAlpha * 0.75})`);
    bellGrad.addColorStop(1, `hsla(${this.hue}, 100%, 50%, ${this.coreAlpha * 0.15})`);
    ctx.fillStyle = bellGrad;
    ctx.shadowColor = `hsla(${this.hue}, 100%, 70%, 0.8)`;
    ctx.shadowBlur = s * 0.4;
    ctx.fill();
    ctx.shadowBlur = 0;

    // rib lines on bell
    ctx.strokeStyle = `hsla(${this.hue}, 100%, 92%, ${this.coreAlpha * 0.55})`;
    ctx.lineWidth = Math.max(0.5, s * 0.012);
    for (let i = -3; i <= 3; i++) {
      const rx = (i / 3.5) * bw;
      ctx.beginPath();
      ctx.moveTo(rx, -bh * 1.55);
      ctx.quadraticCurveTo(rx * 0.8, -bh * 0.6, rx * 0.55, s * 0.02);
      ctx.stroke();
    }

    ctx.restore();
  }
}

// ---------- Flower-type jellyfish (radial fringe, seen bottom-right of reference) ----------
class FlowerJelly {
  constructor() { this.reset(true); }

  reset(initial) {
    this.size = rand(26, 46);
    this.x = rand(-0.1, 1.1) * W;
    this.y = initial ? rand(-0.1, 1.1) * H : H + this.size * 2;
    this.riseSpeed = rand(0.06, 0.14);
    this.driftX = rand(-0.05, 0.05);
    this.phase = rand(0, Math.PI * 2);
    this.hue = pick([195, 200, 205]);
    this.rays = Math.floor(rand(16, 22));
    this.alpha = rand(0.5, 0.85);
    this.blur = rand(0, 1.6);
    this.tSeed = rand(0, 100);
  }

  update(t, dt) {
    this.y -= this.riseSpeed * dt * 18;
    this.x += this.driftX * dt * 18;
    if (this.y < -this.size * 3 || this.x < -this.size * 3 || this.x > W + this.size * 3) {
      this.reset(false);
    }
  }

  draw(t) {
    const s = this.size;
    const pulse = 1 + Math.sin(t * 0.7 + this.phase) * 0.08;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.filter = this.blur > 0.1 ? `blur(${this.blur.toFixed(2)}px)` : 'none';

    // halo
    const haloR = s * 2.8;
    const halo = ctx.createRadialGradient(0, 0, 0, 0, 0, haloR);
    halo.addColorStop(0, `hsla(${this.hue}, 100%, 70%, ${this.alpha * 0.25})`);
    halo.addColorStop(1, `hsla(${this.hue}, 100%, 50%, 0)`);
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(0, 0, haloR, 0, Math.PI * 2);
    ctx.fill();

    // radiating petals/tentacles
    ctx.shadowColor = `hsla(${this.hue}, 100%, 65%, 0.9)`;
    ctx.shadowBlur = s * 0.3;
    for (let i = 0; i < this.rays; i++) {
      const a = (i / this.rays) * Math.PI * 2;
      const wig = Math.sin(t * 1.4 + i * 1.3 + this.tSeed) * 0.12;
      const len = s * pulse * (0.9 + 0.3 * Math.sin(i * 7.1 + this.tSeed));
      const x1 = Math.cos(a) * s * 0.5;
      const y1 = Math.sin(a) * s * 0.5;
      const x2 = Math.cos(a + wig) * len;
      const y2 = Math.sin(a + wig) * len;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.quadraticCurveTo(Math.cos(a) * len * 0.6, Math.sin(a) * len * 0.6, x2, y2);
      const g = ctx.createLinearGradient(x1, y1, x2, y2);
      g.addColorStop(0, `hsla(${this.hue}, 100%, 85%, ${this.alpha})`);
      g.addColorStop(1, `hsla(${this.hue}, 100%, 55%, 0)`);
      ctx.strokeStyle = g;
      ctx.lineWidth = s * 0.045;
      ctx.lineCap = 'round';
      ctx.stroke();
    }
    ctx.shadowBlur = 0;

    // glowing core
    const coreR = s * 0.42 * pulse;
    const coreGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, coreR);
    coreGrad.addColorStop(0, `hsla(${this.hue}, 100%, 95%, ${this.alpha})`);
    coreGrad.addColorStop(1, `hsla(${this.hue}, 100%, 70%, ${this.alpha * 0.2})`);
    ctx.fillStyle = coreGrad;
    ctx.beginPath();
    ctx.arc(0, 0, coreR, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

// ---------- Marine snow particles ----------
class Particle {
  constructor() { this.reset(true); }
  reset(initial) {
    this.x = rand(0, W);
    this.y = initial ? rand(0, H) : H + rand(0, 20);
    this.r = rand(0.4, 1.6);
    this.speed = rand(0.01, 0.05);
    this.alpha = rand(0.08, 0.35);
    this.drift = rand(-0.02, 0.02);
    this.phase = rand(0, Math.PI * 2);
  }
  update(dt, t) {
    this.y -= this.speed * dt * 18;
    this.x += (this.drift + Math.sin(t * 0.2 + this.phase) * 0.03) * dt * 18;
    if (this.y < -5) this.reset(false);
  }
  draw() {
    ctx.beginPath();
    ctx.fillStyle = `rgba(150, 190, 230, ${this.alpha})`;
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ---------- Scene setup ----------
const bellJellies = [];
const flowerJellies = [];
const particles = [];

function buildScene() {
  bellJellies.length = 0;
  flowerJellies.length = 0;
  particles.length = 0;
  const jellyCount = Math.max(5, Math.round((W * H) / 145000));
  for (let i = 0; i < jellyCount; i++) {
    bellJellies.push(new BellJelly(rand(0, 1)));
  }
  const flowerCount = Math.max(2, Math.round(jellyCount / 3));
  for (let i = 0; i < flowerCount; i++) {
    flowerJellies.push(new FlowerJelly());
  }
  const particleCount = Math.max(30, Math.round((W * H) / 9000));
  for (let i = 0; i < particleCount; i++) {
    particles.push(new Particle());
  }
}

window.addEventListener('resize', () => {
  resize();
});

buildScene();
window.addEventListener('resize', buildScene);

function drawBackground() {
  const g = ctx.createRadialGradient(
    W * 0.5, H * 0.65, 0,
    W * 0.5, H * 0.65, Math.max(W, H) * 0.85
  );
  g.addColorStop(0, '#071427');
  g.addColorStop(0.45, '#04101f');
  g.addColorStop(1, '#020509');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

let last = performance.now();
let elapsed = 0;

function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if (!prefersReducedMotion) elapsed += dt;

  drawBackground();

  // sort background-to-foreground by depth for bell jellies
  bellJellies.sort((a, b) => a.depth - b.depth);

  for (const p of particles) {
    if (!prefersReducedMotion) p.update(dt, elapsed);
    p.draw();
  }

  for (const j of bellJellies) {
    if (!prefersReducedMotion) j.update(elapsed, dt);
    j.draw(elapsed);
  }

  for (const f of flowerJellies) {
    if (!prefersReducedMotion) f.update(elapsed, dt);
    f.draw(elapsed);
  }

  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
</body>
</html>
